{% extends "base.html" %}

{% block content %}
<section id="contact" class="contact section">

    <div class="container" data-aos="fade">
  
      <div class="row gy-5 gx-lg-5">
  
        <div class="col-lg-4">

          <div class="info">
            <h3>Página de pesquisa</h3>
            <p>Et id eius voluptates atque nihil voluptatem enim in tempore minima sit ad mollitia commodi minus.</p>
          </div>
  
        </div>
  
        <div class="col-lg-8">
          <form method="get">
            <div class="form-group mt-3">
              <input type="text" class="form-control" name="q" id="subject" placeholder="Pesquisa">
            </div>
            <div class="my-3">
              <div class="error-message"></div>

            </div>
            <div class="text-center"><button type="submit">BUSCAR</button></div>
          </form>
        </div><!-- End Contact Form -->
  
      </div>
  
    </div>
  
  </section><!-- /Contact Section -->
  
{% if query %}
<div class="mt-3">
    <h3 id="result">Resultados para: {{ query|safe }}</h3>
</div>
{% endif %}
<script>
function getFlag() {
        const parts = ['${AlohaHacking', 'Club-', 'XSS}'];
        return `FLAG: ${parts[0]}${parts[1]}${parts[2]}`;
    }
    window.originalAlert = window.alert;
    window.alert = function(message) {
        window.originalAlert(message);
        const resultDiv = document.getElementById('result');
        if (resultDiv) {
            setTimeout(() => {
                resultDiv.innerHTML = `<h3 style="color:green">${getFlag()}</h3>`;
            }, 500);
        }
    };
</script>
{% endblock %}
