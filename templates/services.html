{% extends "base.html" %}

{% block content %}
<section id="contact" class="contact section">

    <div class="container" data-aos="fade">
  
      <div class="row gy-5 gx-lg-5">
  
        <div class="col-lg-4">

          <div class="info">
            <h3>Página em manutenção</h3>
            <p>Working in progress...</p>
          </div>
  
        </div>
  
        <div class="col-lg-8">
          <form method="get">
            <div class="form-group mt-3">
              <input type="text" class="form-control" name="filename" placeholder="Pesquisa">
            </div>  
            <div class="my-3">
              <div class="error-message"></div>

            </div>
            <div class="text-center"><button type="submit">Buscar</button></div>
          </form>
          {% if content %}
          <div class="mt-3">
              <h3>Resultados:</h3>
              <pre>{{ content }}</pre>
          </div>
          {% endif %}
        </div><!-- End Contact Form -->
  
      </div>
  
    </div>
  
  </section><!-- /Contact Section -->

{% endblock %}
